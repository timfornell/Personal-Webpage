name = "personal-webpage"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Behåll variabler som lagts in i Cloudflares panel vid varje deploy.
keep_vars = true

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.client.js"]
fallthrough = true

# D1-databasen som sparar de senaste två månadernas pass och dina inställningar.
[[d1_databases]]
binding = "DB"
database_name = "personal-webpage"
database_id = "b1ecbffc-8928-44ca-8670-4a637682b58a"
